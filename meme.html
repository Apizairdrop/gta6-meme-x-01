<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; position:relative;
         font-family:"Noto Sans","DejaVu Sans",Arial,sans-serif; background:#ff7a3d; }
  svg.scene { position:absolute; inset:0; width:1080px; height:1080px; display:block; }
  .txt { position:absolute; left:0; width:1080px; text-align:center; font-weight:900;
         color:#fff; letter-spacing:1px; line-height:1.04;
         -webkit-text-stroke:3px #111; paint-order:stroke fill;
         text-shadow:0 6px 0 rgba(0,0,0,.55); }
  .top { top:26px; font-size:96px; }
  .top .row2 { font-size:118px; color:#ffe14d; }
  .bottom { top:852px; font-size:58px; }
  .bottom .row2 { font-size:58px; color:#ffe14d; }
  .pill { position:absolute; left:50%; transform:translateX(-50%); bottom:14px;
          background:#e6007e; border:4px solid #111; border-radius:40px;
          color:#fff; font-weight:900; font-size:29px; letter-spacing:.5px;
          padding:10px 30px; white-space:nowrap; box-shadow:0 4px 0 rgba(0,0,0,.5); }
  .pill b { color:#ffe14d; }
</style></head><body>
<svg class="scene" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset=".45" stop-color="#ff5e8a"/>
      <stop offset=".75" stop-color="#8a3ffc"/><stop offset="1" stop-color="#3b1a8a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9e57"/><stop offset="1" stop-color="#c94b7c"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#f2b25c"/>
    </linearGradient>
  </defs>

  <!-- sky + sun -->
  <rect x="0" y="0" width="1080" height="640" fill="url(#sky)"/>
  <circle cx="540" cy="430" r="140" fill="#ffd166"/>
  <circle cx="540" cy="430" r="172" fill="#ffd166" opacity=".25"/>

  <!-- skyline -->
  <g fill="#2a0a4a">
    <rect x="0" y="500" width="70" height="140"/><rect x="80" y="440" width="90" height="200"/>
    <rect x="180" y="520" width="60" height="120"/><rect x="250" y="410" width="80" height="230"/>
    <rect x="340" y="530" width="55" height="110"/><rect x="700" y="520" width="60" height="120"/>
    <rect x="770" y="420" width="85" height="220"/><rect x="865" y="500" width="65" height="140"/>
    <rect x="940" y="440" width="90" height="200"/><rect x="1040" y="520" width="40" height="120"/>
    <rect x="255" y="372" width="70" height="38"/><rect x="775" y="382" width="75" height="38"/>
  </g>
  <g fill="#ffd166" opacity=".9">
    <rect x="100" y="470" width="14" height="18"/><rect x="130" y="510" width="14" height="18"/>
    <rect x="270" y="440" width="14" height="18"/><rect x="300" y="490" width="14" height="18"/>
    <rect x="790" y="450" width="14" height="18"/><rect x="820" y="500" width="14" height="18"/>
    <rect x="960" y="470" width="14" height="18"/><rect x="990" y="520" width="14" height="18"/>
  </g>

  <!-- sea + sand -->
  <rect x="0" y="640" width="1080" height="60" fill="url(#sea)"/>
  <g stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round">
    <path d="M60 668 H300"/><path d="M780 662 H1020"/><path d="M420 688 H660"/>
  </g>
  <rect x="0" y="700" width="1080" height="380" fill="url(#sand)"/>

  <!-- palm left -->
  <g stroke="#1d0533" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M70 700 C 80 580, 60 500, 95 420"/>
    <path d="M95 420 C 40 380, 10 390, 5 440"/><path d="M95 420 C 60 360, 30 355, 15 390"/>
    <path d="M95 420 C 150 370, 185 380, 195 430"/><path d="M95 420 C 140 350, 175 345, 190 385"/>
    <path d="M95 420 C 95 360, 110 330, 140 320"/>
  </g>
  <circle cx="82" cy="432" r="13" fill="#1d0533"/><circle cx="108" cy="428" r="11" fill="#1d0533"/>
  <!-- palm right -->
  <g stroke="#1d0533" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M1010 700 C 1000 580, 1020 500, 985 420"/>
    <path d="M985 420 C 1040 380, 1070 390, 1075 440"/><path d="M985 420 C 1020 360, 1050 355, 1065 390"/>
    <path d="M985 420 C 930 370, 895 380, 885 430"/><path d="M985 420 C 940 350, 905 345, 890 385"/>
    <path d="M985 420 C 985 360, 970 330, 940 320"/>
  </g>
  <circle cx="998" cy="432" r="13" fill="#1d0533"/><circle cx="972" cy="428" r="11" fill="#1d0533"/>

  <!-- beach towel with make.fun -->
  <g transform="rotate(-3 540 765)">
    <rect x="300" y="700" width="480" height="130" rx="18" fill="#e6007e" stroke="#111" stroke-width="6"/>
    <rect x="300" y="700" width="480" height="24" rx="12" fill="#ff4da6"/>
    <rect x="300" y="806" width="480" height="24" rx="12" fill="#ff4da6"/>
    <text x="540" y="790" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"
          font-size="68" font-weight="900" fill="#ffffff" letter-spacing="1">make.fun</text>
  </g>

  <!-- GHOST: white, thick black outline, sparkle eyes, shades on forehead, controller + star coin -->
  <g transform="translate(365 230)">
    <!-- body -->
    <path d="M175 470 L175 210 C175 95 245 25 350 25 C455 25 525 95 525 210 L525 470
             L487 432 L449 470 L411 432 L373 470 L335 432 L297 470 L259 432 L221 470 L183 432 Z"
          fill="#ffffff" stroke="#111" stroke-width="11" stroke-linejoin="round"/>
    <!-- sparkle eyes -->
    <path d="M305 130 C312 168 318 174 356 181 C318 188 312 194 305 232 C298 194 292 188 254 181 C292 174 298 168 305 130 Z" fill="#111"/>
    <path d="M445 130 C452 168 458 174 496 181 C458 188 452 194 445 232 C438 194 432 188 394 181 C432 174 438 168 445 130 Z" fill="#111"/>
    <!-- smile -->
    <path d="M335 268 Q375 292 415 268" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="280" cy="255" r="16" fill="#ff9ecf" opacity=".8"/>
    <circle cx="470" cy="255" r="16" fill="#ff9ecf" opacity=".8"/>
    <!-- sunglasses pushed up on forehead -->
    <g transform="rotate(-6 350 78)">
      <rect x="245" y="52" width="92" height="52" rx="24" fill="#111"/>
      <rect x="363" y="52" width="92" height="52" rx="24" fill="#111"/>
      <rect x="337" y="66" width="26" height="10" rx="5" fill="#111"/>
      <rect x="255" y="64" width="72" height="10" rx="5" fill="#4dd7ff" opacity=".85"/>
      <rect x="373" y="64" width="72" height="10" rx="5" fill="#4dd7ff" opacity=".85"/>
    </g>
    <!-- left hand holding magenta star coin -->
    <circle cx="150" cy="330" r="26" fill="#fff" stroke="#111" stroke-width="8"/>
    <g transform="translate(118 268)">
      <circle r="46" fill="#e6007e" stroke="#111" stroke-width="7"/>
      <path d="M0 -30 L8 -9 L30 -9 L12 4 L18 26 L0 13 L-18 26 L-12 4 L-30 -9 L-8 -9 Z" fill="#fff"/>
    </g>
    <!-- controller in right hand, in front of body edge -->
    <g transform="translate(515 350) rotate(18) scale(1.15)">
      <rect x="-80" y="-38" width="160" height="80" rx="34" fill="#111" stroke="#fff" stroke-width="5"/>
      <circle cx="-44" cy="0" r="12" fill="#fff"/><circle cx="44" cy="-10" r="8" fill="#ffe14d"/>
      <circle cx="60" cy="10" r="8" fill="#e6007e"/><circle cx="28" cy="12" r="8" fill="#4dd7ff"/>
    </g>
    <circle cx="548" cy="352" r="26" fill="#fff" stroke="#111" stroke-width="8"/>
  </g>

  <!-- GTA 6 game case leaning on the sand -->
  <g transform="translate(878 645) rotate(10)">
    <rect x="0" y="0" width="164" height="180" rx="12" fill="#ffffff" stroke="#111" stroke-width="7"/>
    <rect x="0" y="0" width="164" height="32" rx="12" fill="#e6007e"/>
    <text x="82" y="138" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"
          font-size="48" font-weight="900" fill="#111">GTA 6</text>
    <text x="82" y="168" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"
          font-size="19" font-weight="900" fill="#e6007e" letter-spacing="3">VICE CITY</text>
  </g>

  <!-- beach ball -->
  <g transform="translate(120 765)">
    <circle r="42" fill="#fff" stroke="#111" stroke-width="6"/>
    <path d="M0 -42 A42 42 0 0 1 36 21 L0 0 Z" fill="#e6007e"/>
    <path d="M0 -42 A42 42 0 0 0 -36 21 L0 0 Z" fill="#4dd7ff"/>
    <path d="M-36 21 A42 42 0 0 0 36 21 L0 0 Z" fill="#ffe14d"/>
  </g>
</svg>

<div class="txt top">ME, CALLING IN<br><span class="row2">SICK TODAY</span></div>
<div class="txt bottom">IT'S FINALLY OUT. 13 YEARS.<br><span class="row2">SEE YOU IN VICE CITY.</span></div>
<div class="pill">MY AGENT EARNS REAL MONEY ON <b>make.fun</b></div>
</body></html>
